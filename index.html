<style>
/* Layout: majanca design language — translucent top bar with blue Lexend brand, airy single column,
   light-weight section titles with tiny uppercase Questrial subtitles, hairline-bordered cards. */
:root{
  --accent:#3300C0; --accent-soft:rgba(51,0,192,.07); --accent-mid:rgba(51,0,192,.18);
  --r-ex:#1f3f99; --r-o:#4d7adb; --r-t:#f08a00; --r-x:#df5561;
  --bg:#ffffff; --bg-elev:#f7f7f8; --bg-elev-2:#f0f0f2; --sticky:#f0f0f0;
  --text:#0a0a0a; --text-sub:#5a5a5a; --text-dim:#9a9a9a;
  --border:rgba(0,0,0,.07); --border-strong:rgba(10,10,10,.14);
  --ok:#4d7adb; --ok-soft:rgba(77,122,219,.10); --ng:#df5561; --ng-soft:rgba(223,85,97,.10);
  --bar:rgba(255,255,255,.82); --mask:#e4e4e6;
  --shadow:0 6px 24px rgba(0,0,0,.05);
  --r-sm:10px; --r:16px; --r-lg:24px;
  --font-display:'Lexend',system-ui,sans-serif;
  --font-ui:'Questrial',system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#9b85ff; --accent-soft:rgba(155,133,255,.14); --accent-mid:rgba(155,133,255,.3);
  --r-ex:#4a72e8; --r-o:#93b4f5; --r-t:#ffa53a; --r-x:#ea6873;
  --bg:#121212; --bg-elev:#1e1e1e; --bg-elev-2:#2a2a2a; --sticky:#2a2a2a;
  --text:#ececec; --text-sub:#b0b0b0; --text-dim:#6a6a6a;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.16);
  --ok:#6b93ea; --ok-soft:rgba(107,147,234,.14); --ng:#ea6873; --ng-soft:rgba(234,104,115,.14);
  --bar:rgba(18,18,18,.82); --mask:#2a2e36; --shadow:0 8px 32px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#9b85ff; --accent-soft:rgba(155,133,255,.14); --accent-mid:rgba(155,133,255,.3);
  --r-ex:#4a72e8; --r-o:#93b4f5; --r-t:#ffa53a; --r-x:#ea6873;
  --bg:#121212; --bg-elev:#1e1e1e; --bg-elev-2:#2a2a2a; --sticky:#2a2a2a;
  --text:#ececec; --text-sub:#b0b0b0; --text-dim:#6a6a6a;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.16);
  --ok:#6b93ea; --ok-soft:rgba(107,147,234,.14); --ng:#ea6873; --ng-soft:rgba(234,104,115,.14);
  --bar:rgba(18,18,18,.82); --mask:#2a2e36; --shadow:0 8px 32px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:13.8px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color .3s var(--ease),color .3s var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bar)}
::selection{background:var(--accent-mid)}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20.2px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;vertical-align:middle;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.container{max-width:760px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 40px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:760px;margin:0 auto;padding-block:13px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--font-display);font-weight:600;letter-spacing:-.04em;font-size:19.3px;color:var(--accent);display:flex;align-items:center;gap:6px;min-width:0}
.brand .pl{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:26px;letter-spacing:.005em;line-height:1;color:var(--text)}
.brand .logo{height:15px;width:auto;flex:none;color:var(--accent);margin-right:2px}
.mtitle{font-family:'Kosugi Maru',var(--font-body);font-weight:400;font-size:24px;letter-spacing:.01em;color:var(--accent);margin:30px 0 0;line-height:1.3}
.mtitle .no{font-size:90%}
/* portal */
.pt{position:relative;padding-top:18px}
.pt-h{position:relative;z-index:2;font-family:'Instrument Sans',var(--font-body);font-weight:300;font-size:clamp(46px,12.5vw,128px);line-height:.94;letter-spacing:-.035em;margin:0;pointer-events:none;text-wrap:balance}
.pt-h i{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent)}
.pt-ascii{position:relative;z-index:1;margin:-14px 0 0 auto;width:min(100%,680px);height:clamp(300px,74vw,460px);cursor:grab;touch-action:pan-y;overflow:hidden;user-select:none}
.pt-ascii:active{cursor:grabbing}
.pt-ascii table{margin:0 auto}
.pt-ascii .hit{position:absolute;inset:0;z-index:2;cursor:grab}
.pt-ascii .hit:active{cursor:grabbing}
.pt-ascii .fallback{display:grid;place-items:center;height:100%;color:var(--accent)}
.pt-ascii .fallback svg{width:60%;height:auto}
.paren{position:absolute;z-index:3;font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:clamp(20px,4.6vw,30px);color:var(--text);pointer-events:none;white-space:nowrap}
.drag{display:flex;justify-content:flex-end;gap:4px;align-items:center;font-family:'Instrument Sans',var(--font-body);font-size:13px;color:var(--text);margin-top:4px}
.pt-lead{font-family:'Instrument Sans',var(--font-body);font-weight:300;font-size:clamp(17px,4.3vw,22px);line-height:1.45;letter-spacing:-.005em;margin:38px 0 0;text-indent:2.2em}
.pt-lead i{font-family:'Instrument Serif',Georgia,serif;font-size:1.1em}
.term{margin-top:46px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;line-height:1.9}
.term .pr{color:var(--text-sub);font-size:12px}
.term .pr b{color:var(--accent);font-weight:400}
.tl{width:100%;display:flex;align-items:baseline;gap:0;white-space:nowrap;padding:1px 6px;margin:0 -6px;text-align:left;font-family:inherit}
.tl .k{color:var(--accent);flex:none;width:4ch;white-space:pre}
.tl .nm{font-family:var(--font-body);font-weight:500;flex:none;margin-left:1ch}
.tl .ld{flex:1;overflow:hidden;color:var(--text-dim);margin:0 1ch;min-width:2ch}
.tl .ld::before{content:"··································································"}
.tl .ct{flex:none}
.tl.on{background:var(--text);color:var(--bg)}
.tl.on .k,.tl.on .ld{color:inherit}
.tl.on .ld{opacity:.6}
.tl:not(.soon):hover .nm,.tl:not(.soon):focus-visible .nm{text-decoration:underline}
.tl.soon{color:var(--text-dim);cursor:default}
.tl.soon .k{color:var(--text-dim)}
.tdesc{font-family:var(--font-body);font-size:11.5px;color:var(--text-sub);margin:2px 0 8px 5ch;line-height:1.6;white-space:normal}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--accent);vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.brand .back-arrow{font-size:20.2px;width:0;overflow:hidden;opacity:0;transition:width .3s var(--ease),opacity .3s var(--ease)}
body.in-sub .brand .back-arrow{width:22px;opacity:1}
.crumb{font-family:var(--font-ui);font-size:11px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{padding:8px;border-radius:50%;display:flex;color:var(--text);transition:background-color .2s,transform .15s var(--ease);flex:none}
.icon-btn:hover{background:var(--bg-elev-2)} .icon-btn:active{transform:scale(.92)}

/* hero */
.hero{padding:36px 0 8px}
.eyebrow{font-family:var(--font-ui);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:24px;height:1px;background:var(--accent)}
.hero-title{font-weight:500;font-size:27.6px;line-height:1.3;margin:0;letter-spacing:-.02em}
.sticky-note{display:inline-block;padding:0 12px;background:var(--sticky);border-radius:10px;white-space:nowrap;margin-bottom:7px}
.hero-sub{margin:18px 0 0;font-family:var(--font-ui);color:var(--text-sub);font-size:12.9px;line-height:1.7}
.hero-cta{display:inline-flex;align-items:center;gap:8px;margin-top:34px;padding:10px 20px;background:var(--text);color:var(--bg);border-radius:var(--r-lg);font-weight:600;font-size:13.8px;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.hero-cta:hover{opacity:.85;transform:translateY(-1px)}
.hero-cta .ms{font-size:18.4px}
.stat-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:28px}
.stat{display:flex;align-items:baseline;gap:6px}
.stat .v{font-family:var(--font-display);font-weight:600;font-size:20.2px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--font-ui);font-size:10.1px;letter-spacing:.04em;color:var(--text-sub);display:inline-flex;align-items:center}
.stat .l .ms{font-size:13.8px}
.stat-sep{width:1px;height:16px;background:var(--border-strong)}
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--bg-elev-2);margin-top:14px}
.bar i{display:block;height:100%}

/* marquee */
.marquee{margin:22px calc(-1 * max(12px,env(safe-area-inset-left,0px))) 0;overflow:hidden;display:grid;gap:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mrow{display:flex;width:max-content;white-space:nowrap;animation:slide var(--dur,90s) linear infinite;will-change:transform}
.mrow.rev{animation-direction:reverse}
.mrow{align-items:center}
.mrow button{color:var(--text);font-size:13px;padding:0 6px;margin:2px 1px;line-height:1.5;border-radius:6px;white-space:nowrap}
.mrow button:hover{text-decoration:underline}
.mrow .w{font-weight:700}
.mrow .a{color:var(--accent);font-weight:700}
.mrow .p{background:var(--accent);color:var(--bg);font-weight:700;padding:0 7px}
.marquee:hover .mrow,.marquee:focus-within .mrow{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.lead{margin:22px 0 0;font-size:13px;line-height:1.8;color:var(--text-sub)}
.pdesc{font-size:12px;color:var(--text-dim);line-height:1.6;margin-top:-4px}
.rc-ex{color:var(--r-ex)} .rc-o{color:var(--r-o)} .rc-t{color:var(--r-t)} .rc-x{color:var(--r-x)}
.chip.on .ms{color:inherit}
/* sections */
.section{margin-top:52px}
.section-head{margin-bottom:18px}
.section-title{font-weight:300;font-size:20.2px;letter-spacing:-.02em;margin:0}
.section-subtitle{font-family:var(--font-ui);font-size:9.2px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);margin-top:2px}
.note{font-family:var(--font-ui);font-size:11px;color:var(--text-dim);margin-top:10px}
.cards{display:grid;gap:10px}
.mode-card{width:100%;text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.mode-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.mode-card:active{transform:scale(.992)}
.tile{width:42px;height:42px;border-radius:12px;color:#fff;background:var(--accent);font-family:var(--font-display);font-size:12px;display:grid;place-items:center;flex:none;letter-spacing:-.02em}
.mode-card .tx{flex:1;min-width:0}
.mode-card .tx b{display:block;font-weight:500;font-size:14.7px}
.mode-card .tx small{display:block;font-family:var(--font-display);font-weight:300;font-size:10.6px;color:var(--text-dim);letter-spacing:.01em}
.mode-card .tx span{display:block;font-size:11.5px;color:var(--text-sub);margin-top:2px}
.go{flex:none;padding:5px 15px;border:1px solid var(--text);border-radius:999px;font-weight:600;font-size:12px;letter-spacing:.08em}

/* scope panel */
.panel{border:1px solid var(--border);border-radius:var(--r);padding:4px 18px}
.pool{font-size:15px;font-weight:600;color:var(--text)}
.pool b{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0 3px}
.prow{padding:16px 0;display:grid;gap:10px}
.prow+.prow{border-top:1px solid var(--border)}
.plab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.9px}
.plab .v{font-family:var(--font-display);color:var(--text-sub);font-size:12px;font-variant-numeric:tabular-nums}
.plab .v b{color:var(--text);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.one{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips.one::-webkit-scrollbar{display:none}
.chip{background:var(--bg);border:1px solid var(--text);border-radius:100px;padding:7px 14px;font-size:11.5px;color:var(--text);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all .2s}
.chip.on{background:var(--text);color:var(--bg)}
.chip .num{font-size:10.1px;opacity:.7;font-family:var(--font-display)}
.chip .ms{font-size:15.6px}
.range{position:relative;height:30px;margin:0 2px}
.range .track{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:4px;background:var(--bg-elev-2)}
.range .sel{position:absolute;top:13px;height:4px;border-radius:4px;background:var(--accent)}
.range input{position:absolute;left:0;width:100%;top:0;height:30px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.range input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--text);cursor:grab}
.range input::-webkit-slider-runnable-track{background:none}
.range input::-moz-range-track{background:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.9px}
.toggle{position:relative;width:46px;height:26px;background:var(--bg-elev-2);border-radius:100px;transition:background-color .25s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .25s var(--ease-spring)}
.toggle.on{background:var(--accent)} .toggle.on::after{transform:translateX(20px)}

/* segmented */
.seg{display:flex;background:var(--bg-elev-2);border-radius:100px;padding:3px;margin-top:22px}
.seg button{flex:1;padding:9px 8px;font-family:var(--font-ui);font-size:11.5px;color:var(--text-sub);border-radius:100px;border:1px solid transparent;white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--text);font-weight:500;border-color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* name + ruby */
.name{font-weight:600;letter-spacing:-.01em;line-height:1.3}
.name.hasr{display:inline-block;padding-top:.5em}
.name .rb{position:relative;display:inline-block}
.name .rt{position:absolute;left:0;bottom:100%;margin-bottom:-.05em;font-size:.42em;line-height:1.2;font-weight:400;color:var(--text);letter-spacing:.06em;white-space:nowrap}
.card .big .name .rt{left:50%;transform:translateX(-50%)}
.cpill{display:inline-block;background:var(--text);color:var(--bg);border-radius:999px;font-size:11px;font-weight:400;line-height:1;padding:4px 9px;letter-spacing:.02em}
.cpill b{font-family:var(--font-display);font-weight:400}
.sub{font-family:var(--font-display);font-weight:300;font-size:11px;color:var(--text-dim);letter-spacing:.01em}
.meta-line{font-family:var(--font-ui);font-size:11px;color:var(--text-sub);display:flex;flex-wrap:wrap;align-items:center;gap:4px 0}
.meta-line .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px}
.meta-line i{font-style:normal;margin:0 7px;color:var(--text-dim)}

/* flash card */
.progress{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;font-family:var(--font-ui);font-size:11px;color:var(--text-sub)}
.progress b{font-family:var(--font-display);font-weight:600;color:var(--text);font-size:13.8px}
.pbar{height:3px;border-radius:2px;background:var(--bg-elev-2);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .4s var(--ease)}
.card{margin-top:16px;border:1px solid var(--border);border-radius:var(--r);padding:22px 20px;min-height:250px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.card.tap{cursor:pointer}
.card .big{font-size:27.6px;text-align:center;margin:26px 0 6px}
.card .meta-line{justify-content:center}
.hint{margin-top:auto;text-align:center;color:var(--text-dim);font-family:var(--font-ui);font-size:11px;display:flex;justify-content:center;align-items:center;gap:4px}
.hint .ms{font-size:16.6px}
.sec{display:grid;gap:3px}
.sec h4{margin:0;font-family:var(--font-ui);font-size:9.7px;letter-spacing:.16em;color:var(--accent);font-weight:400}
.sec p{margin:0;font-size:13.8px;line-height:1.8}
.supp{color:var(--text-sub)}
.meta{font-family:var(--font-ui);font-size:11px;color:var(--text-sub);display:grid;gap:2px;padding-top:12px;border-top:1px solid var(--border)}
.meta span{font-family:var(--font-display);color:var(--text)}

/* rating */
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rate button{height:52px;border-radius:var(--r);display:grid;place-items:center;color:var(--text-sub);border:1px solid var(--border);background:var(--bg);transition:all .2s var(--ease)}
.rate button:hover{border-color:var(--border-strong)}
.rate button .ms{font-size:23.9px}
.rate button.on,.rate button.on .ms{color:var(--bg)!important}
.rate button.on.k-ex{background:var(--r-ex);border-color:var(--r-ex)}.rate button.on.k-o{background:var(--r-o);border-color:var(--r-o)}.rate button.on.k-t{background:var(--r-t);border-color:var(--r-t)}.rate button.on.k-x{background:var(--r-x);border-color:var(--r-x)}
.mini .ms{font-size:15.6px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;font-family:var(--font-ui);color:var(--text-dim);font-size:11px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--r-lg);font-weight:600;font-size:12.9px;background:var(--text);color:var(--bg);transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.line{background:var(--bg);color:var(--text);border:1px solid var(--text)}
.btn:disabled{opacity:.3;cursor:default}
.btn .ms{font-size:17.5px}

/* quiz: no surrounding card — options are the only bordered boxes */
.stem{margin:22px 0 18px}
.stem .ask{font-size:13.8px;margin-bottom:10px}
.stem .big{font-size:25.8px}
.stem .qtext{font-size:14.7px;line-height:1.85}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--bg);transition:border-color .2s,opacity .2s}
.opt .body{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px 16px;font-size:13.8px;line-height:1.6;transition:background-color .15s}
.opts:not(.answered) .opt .body:hover{background:var(--bg-elev)}
.opt .lt{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg-elev-2);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:11px;color:var(--text-sub);transition:background-color .2s,color .2s}
.opt .txt{flex:1;padding-top:2px}
.opt .strike{flex:none;width:44px;display:grid;place-items:center;color:var(--text-dim)}
.opt .strike .ms{font-size:16.6px}
.opt.out .body{opacity:.45} .opt.out .txt{text-decoration:line-through}
.opt.out .strike{color:var(--text)}
.opt.sel{border-color:var(--accent)} .opt.sel .lt{background:var(--accent);color:#fff}
.opts.answered .opt:not(.ok):not(.ng){opacity:.6}
.opt.ok{border-color:var(--ok)} .opt.ok .lt{background:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng)} .opt.ng .lt{background:var(--ng);color:#fff}
.opt .name{font-size:15.6px}
.verdict{display:flex;align-items:center;gap:8px;margin-top:26px;font-family:var(--font-display);font-weight:500;font-size:18.4px;letter-spacing:-.02em}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.verdict .jp{font-family:var(--font-body);font-size:13.8px;font-weight:500;color:var(--text-sub)}
.ans{margin-top:12px;border-radius:var(--r);background:var(--bg-elev);padding:18px;display:grid;gap:14px}
.ans .name{font-size:18.4px}
.ratelab{font-family:var(--font-body);font-size:12px;letter-spacing:.04em;color:var(--text-dim);margin:22px 2px -2px;text-transform:uppercase}
.score{font-family:var(--font-display);font-size:11px;color:var(--text-sub)}

.itemhead{margin-top:26px}
.itemhead .big{font-size:26px;margin-top:8px}
.endscore{margin-top:10px;font-size:14px;color:var(--text)}
.endscore b{font-family:var(--font-display);font-size:30px;font-weight:600;margin-right:4px}
.endbtns{display:flex;justify-content:center;gap:10px;margin-top:20px}
.mh{margin-top:26px}
.mh .pr,.section>.pr,.gnotes .pr{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--text-sub)}
.pr b{color:var(--accent);font-weight:400}
.mh-t{font-family:'Instrument Sans',var(--font-body);font-weight:300;font-size:clamp(38px,10vw,72px);line-height:1;letter-spacing:-.03em;margin:10px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .25em}
.mh-t .mh-ix{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:.42em;color:var(--text-sub);letter-spacing:0}
.mh-t i{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:var(--accent);letter-spacing:-.01em}
.term.modes{margin-top:8px}
.tl.mode .k{color:var(--accent)}
.tl.mode:hover,.tl.mode:focus-visible{background:var(--text);color:var(--bg)}
.tl.mode:hover .k,.tl.mode:hover .ld{color:inherit}
.linkb{font-size:12px;color:var(--accent)}
.gstar{color:#f08a00;margin-left:6px;font-size:.9em}
.gcard{text-align:left}
.glab{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;color:var(--accent);letter-spacing:.08em;margin-top:6px}
.gfront{font-size:19px;font-weight:600;line-height:1.55;letter-spacing:.01em}
.gback{font-size:16px;line-height:1.7;font-family:'JetBrains Mono',var(--font-body);word-break:break-word}
.tblw{overflow-x:auto;margin-top:10px}
.gt{border-collapse:collapse;width:100%;font-size:12.5px;min-width:340px}
.gt th,.gt td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.gt th{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:400;font-size:11px;color:var(--text-sub);border-bottom:1px solid var(--text)}
.gt td:first-child{font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--accent);white-space:nowrap}
.gl2{margin:10px 0 0;padding-left:1.2em;font-size:13px;line-height:1.8}
.gsrc{font-size:12px;color:var(--text-dim);line-height:1.7;margin:16px 0 0}
.glist{margin-top:10px}
.ghd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--accent);margin:22px 0 4px}
.gli{border-bottom:1px solid var(--border)}
.gli>button{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:11px 2px}
.gli .rk{width:18px;flex:none;color:var(--text-dim);margin-top:2px}
.gtx{display:grid;gap:2px;min-width:0}
.gf{font-size:14px;font-weight:500;line-height:1.55}
.gb{font-size:13px;color:var(--text-sub);line-height:1.6;font-family:'JetBrains Mono',var(--font-body);word-break:break-word}
.gli .rate{margin:0 0 12px 28px}
/* footer */
.foot{margin-top:72px;padding-top:24px;border-top:1px solid var(--border);display:grid;gap:8px;color:var(--text-sub);font-size:12px;line-height:1.7}
.foot p{margin:0}
.fbrand{display:flex;align-items:center;gap:6px;font-family:'Instrument Serif',Georgia,serif;font-size:24px;color:var(--text);line-height:1}
.fbrand .logo{height:13px;width:auto;color:var(--accent)}
.fcopy{font-family:var(--font-ui);color:var(--text-dim);font-size:11px;margin-top:6px}
/* list */
.search{margin-top:22px;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:100px;background:var(--bg-elev-2);color:var(--text-sub)}
.search .ms{font-size:18.4px}

.list{margin-top:12px;border-top:1px solid var(--border)}
.li{border-bottom:1px solid var(--border)}
.li>button{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 4px}
.li>button:hover{background:var(--bg-elev)}

.li .rk{width:18px;color:var(--text-dim);flex:none}
.li .detail{padding:2px 4px 18px 34px;display:grid;gap:12px}
.empty{margin-top:20px;padding:44px 20px;text-align:center;color:var(--text-sub);background:var(--bg-elev);border-radius:var(--r-lg);font-size:12.9px}
.empty small{display:block;color:var(--text-dim);font-size:11px;margin-top:4px}
.fade{animation:fadeUp .5s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.marquee{overflow-x:auto}}
@media (max-width:480px){.hero-title{font-size:24.8px}.card .big{font-size:23.9px}.stem .big{font-size:23px}.li .detail{padding-left:16px}}

"id":"sug:610","s":18,"f":"QT間隔短縮＋口渇・多尿・便秘","b":"高Ca血症","st":0},{"id":"sug:611","s":18,"f":"QT間隔延長＋テタニー","b":"低Ca血症","st":0},{"id":"sug:612","s":18,"f":"重度の低Mg血症＋補正しにくい低K血症・低Ca血症","b":"Mg欠乏","st":0},{"id":"sug:613","s":18,"f":"低pH＋高PaCO2","b":"呼吸性アシドーシス（一次性の場合）","st":0},{"id":"sug:614","s":18,"f":"高pH＋低PaCO2","b":"呼吸性アルカローシス（一次性の場合）","st":0},{"id":"sug:615","s":18,"f":"低pH＋低HCO3−","b":"代謝性アシドーシス（一次性の場合）","st":0},{"id":"sug:616","s":18,"f":"高pH＋高HCO3−","b":"代謝性アルカローシス（一次性の場合）","st":0},{"id":"sug:617","s":18,"f":"反復嘔吐＋低Cl・低K血症＋HCO3−上昇","b":"低Cl性代謝性アルカローシス","st":0},{"id":"sug:618","s":18,"f":"大量下痢＋HCO3−低下＋Cl上昇＋AG正常","b":"高Cl性代謝性アシドーシス","st":0},{"id":"sug:619","s":18,"f":"ショック＋乳酸高値＋AG開大","b":"乳酸アシドーシス","st":0}]}}</script>
<script>
(()=>{
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const CATS=[['D','疾患','疾患・症候群'],['S','所見','徴候・所見・反射'],['C','分類','分類・基準・スコア'],['T','検査','検査・手技・染色・法則'],['A','解剖','解剖・組織・細胞']];
const RATES=[['ex','◎'],['o','○'],['t','△'],['x','×']];
const $=s=>document.querySelector(s);
let DATA=[],MAXC=59;
const st=Object.assign({view:'portal',min:1,max:59,cats:['D','S','C','T','A'],rates:['ex','o','t','x','none'],order:'rand',qmode:'p'},LS.get('epo-st',{}));
if(st.tab&&!LS.get('epo-v3',0)){st.view='home';delete st.tab;LS.set('epo-v3',1)}
let R=LS.get('epo-r',{});
const save=()=>LS.set('epo-st',st), saveR=()=>LS.set('epo-r',R);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* theme */
const themes=['system','light','dark'];
function applyTheme(){const t=LS.get('epo-theme','system');if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  $('#themeIcon').textContent=t==='system'?'contrast':t==='light'?'light_mode':'dark_mode';$('#btnTheme').title=t==='system'?'システム設定に合わせる':t==='light'?'ライト':'ダーク'}
$('#btnTheme').onclick=()=>{const t=LS.get('epo-theme','system');LS.set('epo-theme',themes[(themes.indexOf(t)+1)%3]);applyTheme();if(st.view==='portal'&&$('#ascii'))startAscii($('#ascii'))};
applyTheme();

/* helpers */
const pillHTML=it=>`<div class="cpill">出題 <b>${it.c}</b>回</div>`;
function nameHTML(it){
  if(it.rb&&it.rt) return `<span class="name hasr"><span class="rb"><span class="rt">${esc(it.rt)}</span>${esc(it.rb)}</span>${esc(it.rest)}</span>`;
  return `<span class="name">${esc(it.n)}</span>`;
}
function segHTML(segs){return segs.filter(s=>st.supp||!s[1]).map(s=>s[1]?`<span class="supp">${esc(s[0])}</span>`:esc(s[0])).join('')}
st.supp=true;
const has=segs=>segs&&segs.some(s=>st.supp||!s[1]);
function rateIcon(r){
  if(r==='ex')return '<span class="ms rc-ex">circle_circle</span>';
  if(r==='o')return '<span class="ms rc-o">circle</span>';
  if(r==='t')return '<span class="ms rc-t">change_history</span>';
  if(r==='x')return '<span class="ms rc-x">close</span>';
  return '<span class="ms" style="opacity:.4">remove</span>';
}
const catName=k=>CATS.find(x=>x[0]===k)[2];
function detailHTML(it){
  const lab=it.k==='D'?['病態・概要','検査・所見','治療']:['説明','関連疾患・臨床的意義'];
  const fs=[it.p,it.x,it.t];let h='';
  lab.forEach((l,i)=>{if(has(fs[i]))h+=`<div class="sec"><h4>${l}</h4><p>${segHTML(fs[i])}</p></div>`});
  h+=`<div class="meta"><div>出題回数 <span>${it.c}回</span>（うち解説に登場 <span>${it.e}回</span>）</div><div>分野：${esc(it.fld)}</div><div>QB：${esc(it.q)}</div></div>`;
  return h;
}
function ratingBar(it,onRate){
  const w=document.createElement('div');w.className='rate';
  RATES.forEach(([k,l])=>{const b=document.createElement('button');b.setAttribute('aria-label',l);b.innerHTML=rateIcon(k);
    b.classList.add('k-'+k);if(R[it.id]===k)b.classList.add('on');
    b.onclick=e=>{e.stopPropagation();R[it.id]=k;saveR();[...w.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');onRate&&onRate(k)};w.appendChild(b)});
  return w;
}
function pool(){return DATA.filter(it=>it.c>=st.min&&it.c<=st.max&&st.cats.includes(it.k)&&st.rates.includes(R[it.id]||'none'))}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const WEAK={x:0,t:1,none:2,o:3,ex:4};
function scopeText(){const c=st.cats.length===5?'全ジャンル':st.cats.map(k=>CATS.find(x=>x[0]===k)[1]).join('・');return `${c}　出題${st.min}〜${st.max}回`}

/* routing */
const VIEWS={portal:'',home:'eponym',memo:'eponym / 暗記カード',quiz:'',study:'eponym / 学習リスト',item:'eponym / 解説'};
const PARENT={memo:'home',quiz:'home',study:'home',item:'home',home:'portal','g-home':'portal','g-memo':'g-home','g-quiz':'g-home','g-study':'g-home'};
/* ----- 文字がランダムに消えて現れる遷移 ----- */
const RMQ=matchMedia('(prefers-reduced-motion: reduce)');let scrTok=0,navBusy=false;
function visText(root){const out=[],vh=innerHeight;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;const p=n.parentElement;if(!p||p.closest('.ms,#ascii,.cur,script,style'))return NodeFilter.FILTER_REJECT;const r=p.getBoundingClientRect();if(r.bottom<-40||r.top>vh+40||!r.width)return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}});let n;while((n=w.nextNode())&&out.length<900)out.push(n);return out}

  const step=()=>{if(tok!==scrTok)return fin();const k=Math.min(1,(performance.now()-t0)/ms),up=Math.floor(pos.length*(k*k*(3-2*k)));const touched=new Set();

let qcur=null,qn=0,qok=0,qdeck=null,qi=0;
function tokens(it){const t=new Set();const add=s=>{if(s&&s.length>=2)t.add(s)};add(it.rb);add(it.rt);
  (it.rb||'').split(/[-\s・]/).forEach(x=>x.length>=3&&add(x));(it.rt||'').split('・').forEach(x=>x.length>=2&&add(x));
  const core=it.n.replace(/（.*?）/g,'');add(core);return [...t].sort((a,b)=>b.length-a.length)}
function maskSegs(segs,it){const tk=tokens(it);return segs.map(([s,f])=>{let x=s;tk.forEach(k=>{x=x.split(k).join('〇〇')});return [x,f]})}
const fieldOf=(it,m)=>m==='x'?it.x:m==='t'?it.t:it.p;
function firstCh(it){return (it.fld||'').split('、')[0].replace(/\(.*/,'')}
function makeQ(){
  const m=st.qmode;
  if(!qdeck){const P=pool().filter(it=>has(fieldOf(it,m==='r'?'p':m))&&(m==='p'||m==='r'||it.k==='D'));
    if(!P.length)return null;qdeck=shuffle(P);qi=0;qn=0;qok=0}
  if(qi>=qdeck.length)return 'end';
  const it=qdeck[qi];
  const fm=m==='r'?'p':m;
  let cand=DATA.filter(o=>o.id!==it.id&&has(fieldOf(o,fm))&&(fm==='p'?o.k===it.k:o.k==='D'));
  const same=shuffle(cand.filter(o=>firstCh(o)===firstCh(it))),other=shuffle(cand.filter(o=>firstCh(o)!==firstCh(it)));
  const ds=[...same.slice(0,2),...other].slice(0,4);
  return {it,opts:shuffle([it,...ds]),m,sel:null,out:new Set(),done:false};

  v.appendChild(nav);
  if(q.done)$('#qn').onclick=()=>{gqi++;gq=null;renderGQuiz();scrollTo({top:0,behavior:'smooth'})};
  else{$('#qs').onclick=()=>{gqi++;gq=null;renderGQuiz()};$('#qa').onclick=()=>{if(q.sel==null)return;q.done=true;const ok=q.opts[q.sel]===it;gqn++;if(ok)gqok++;if(!ok)R[it.id]='x';else if(R[it.id]!=='ex')R[it.id]='o';saveR();renderGQuiz()}}
}

let gopen=new Set(),gquery='';
function renderGStudy(){
  const C=GCFG[st.mod],M=GM[st.mod],v=$('#view');v.innerHTML='';
  const s=document.createElement('label');s.className='search';s.innerHTML=`<span class="ms">search</span><input id="gqv" type="search" placeholder="${C.fl}・${C.bl}で検索" value="${esc(gquery)}">`;v.appendChild(s);
  const sc=document.createElement('div');sc.className='progress';v.appendChild(sc);
  const list=document.createElement('div');list.className='glist';v.appendChild(list);
  const draw=()=>{const qq=gquery.trim().toLowerCase();let P=gpool();if(qq)P=P.filter(it=>(it.f+' '+it.b).toLowerCase().includes(qq));
    sc.innerHTML=`<span>${esc(gScope())}</span><span><b>${P.length}</b> ${C.unit}</span>`;list.innerHTML=P.length?'':'<div class="empty">該当する項目がありません</div>';
    let last=-1;P.forEach(it=>{if(it.s!==last){last=it.s;list.insertAdjacentHTML('beforeend',`<div class="ghd">## ${esc(M.secs[it.s])}</div>`)}
      const li=document.createElement('div');li.className='gli';const r=R[it.id];
      li.innerHTML=`<button><span class="rk mini">${rateIcon(r)}</span><span class="gtx"><span class="gf">${esc(it.f)}${starH(it)}</span><span class="gb">→ ${esc(it.b)}</span></span></button>`;
      if(gopen.has(it.id))li.appendChild(ratingBar(it,()=>{gopen.delete(it.id);draw()}));
      li.firstChild.onclick=()=>{gopen.has(it.id)?gopen.delete(it.id):gopen.add(it.id);draw()};list.appendChild(li)})};
  $('#gqv').oninput=e=>{gquery=e.target.value;draw()};draw();
}

let open=new Set(),query=LS.get('epo-q',''),sortBy='count';
function renderStudy(){
  const v=$('#view');v.innerHTML='';
  const s=document.createElement('label');s.className='search';s.innerHTML=`<span class="ms">search</span><input id="q" type="search" placeholder="名前・読み・内容で検索" value="${esc(query)}">`;v.appendChild(s);
  const seg=document.createElement('div');seg.className='seg';[['count','出題回数順'],['abc','名前順'],['weak','苦手順']].forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;if(sortBy===k)b.className='on';b.onclick=()=>{sortBy=k;renderStudy()};seg.appendChild(b)});v.appendChild(seg);
  const sc=document.createElement('div');sc.className='progress';v.appendChild(sc);
  const list=document.createElement('div');list.className='list';v.appendChild(list);
  const draw=()=>{const qq=query.trim().toLowerCase();let P=pool();
    if(qq)P=P.filter(it=>(it.n+' '+(it.rt||'')+' '+(it.sub||'')+' '+[it.p,it.x,it.t].flat().map(s=>s[0]).join(' ')).toLowerCase().includes(qq));
    P=P.sort(sortBy==='count'?(a,b)=>b.c-a.c:sortBy==='abc'?(a,b)=>((a.rt||a.n)).localeCompare(b.rt||b.n,'ja'):(a,b)=>WEAK[R[a.id]||'none']-WEAK[R[b.id]||'none']||b.c-a.c);
    sc.innerHTML=`<span>${esc(scopeText())}</span><span><b>${P.length}</b> 語</span>`;
    list.innerHTML=P.length?'':'<div class="empty" style="margin:0;border-radius:0">該当する語がありません</div>';
    P.forEach(it=>{const li=document.createElement('div');li.className='li';const r=R[it.id];
      li.innerHTML=`<button><span class="rk mini">${rateIcon(r)}</span>${nameHTML(it)}<span class="cnt">${it.c}回</span><span class="ms" style="color:var(--fg3)">${open.has(it.id)?'expand_less':'expand_more'}</span></button>`;
      if(open.has(it.id)){const d=document.createElement('div');d.className='detail';d.innerHTML=`<div class="meta-line"><span class="d"></span>${catName(it.k)}<i>·</i>${esc(it.o)}${it.sub?`<i>·</i>${esc(it.sub)}`:''}</div>`+detailHTML(it);d.appendChild(ratingBar(it,()=>draw()));li.appendChild(d)}
      li.firstChild.onclick=()=>{open.has(it.id)?open.delete(it.id):open.add(it.id);draw()};list.appendChild(li)})};
  $('#q').oninput=e=>{query=e.target.value;LS.set('epo-q',query);draw()};draw();
}

Promise.resolve([JSON.parse(document.getElementById('epo-data').textContent),JSON.parse(document.getElementById('gm-data').textContent)]).then(([d,g])=>{Object.assign(GM,g);DATA=d;MAXC=Math.max(...d.map(x=>x.c));if(st.max>MAXC||st.max===59)st.max=MAXC;render()})
 .catch(()=>{$('#view').innerHTML='<div class="empty">データを読み込めませんでした<small>ページを再読み込みしてください</small></div>'});
})();
</script>
